name: Build Model 2 Modern FFB

on:
  push:
    branches:
      - model2-modern-ffb
      - model2-modern-ffb-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win32-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Restore plugin NuGet packages
        run: nuget restore Dinput8Wrapper.sln -NonInteractive

      - name: Patch upstream missing Cars source entry
        shell: pwsh
        run: |
          $projectPath = 'Dinput8Wrapper.vcxproj'
          $project = Get-Content $projectPath -Raw
          if ($project -notmatch 'Game Files\\Cars\.cpp') {
            $needle = '    <ClCompile Include="Game Files\CrazyTaxi.cpp" />'
            $replacement = $needle + "`r`n" + '    <ClCompile Include="Game Files\Cars.cpp" />'
            if (-not $project.Contains($needle)) { throw 'Could not locate insertion point for Cars.cpp' }
            $project = $project.Replace($needle, $replacement)
            [System.IO.File]::WriteAllText((Resolve-Path $projectPath), $project)
          }

      - name: Build Generic DD plugin Win32 Release
        run: msbuild Dinput8Wrapper.sln /m /p:Configuration=Release /p:Platform=x86 /verbosity:minimal

      - name: Download official upstream 2.0.0.53 distribution
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'FFB.Arcade.Plugin.v2.0.0.53.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'FFBArcadePlugin-Upstream'
          $url = 'https://github.com/Boomslangnz/FFBArcadePlugin/releases/download/2.0.0.53/FFB.Arcade.Plugin.v2.0.0.53.zip'
          curl.exe -L --fail --retry 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download official upstream package' }
          Expand-Archive -Path $zip -DestinationPath $dst -Force

      - name: Assemble full official-style Model 2 package
        shell: pwsh
        run: |
          $built = Resolve-Path 'Release.Win32\M2Emulator'
          $upstream = Join-Path $env:RUNNER_TEMP 'FFBArcadePlugin-Upstream'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'Package.Model2.GenericDD.Full'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # Locate the official Model 2 package by GameId=25 and copy that entire
          # directory unchanged as the distribution baseline. This means users do
          # not need a separate FFB Arcade Plugin installation just to get its GUI
          # or companion runtime files.
          $m2Ini = Get-ChildItem -Path $upstream -Recurse -Filter 'FFBPlugin.ini' |
            Where-Object {
              $text = Get-Content $_.FullName -Raw
              $text -match '(?m)^\s*GameId\s*=\s*25\s*$'
            } |
            Select-Object -First 1
          if ($null -eq $m2Ini) { throw 'Could not locate official Model 2 FFBPlugin.ini in upstream 2.0.0.53 package' }

          $m2Source = $m2Ini.Directory.FullName
          Write-Host "Official Model 2 baseline: $m2Source"
          Copy-Item (Join-Path $m2Source '*') $stage -Recurse -Force

          # Overlay only the files intentionally changed by this branch.
          Copy-Item (Join-Path $built 'dinput8.dll') (Join-Path $stage 'dinput8.dll') -Force

          $sdl = Get-ChildItem -Path 'packages' -Recurse -Filter 'SDL2.dll' |
            Where-Object { $_.FullName -match '(?i)(x86|win32)' } |
            Select-Object -First 1
          if ($null -eq $sdl) { throw 'Win32 SDL2.dll was not found in restored NuGet packages' }
          Copy-Item $sdl.FullName (Join-Path $stage 'SDL2.dll') -Force

          # Preserve every official Model 2 setting/input key, then append the
          # manufacturer-neutral Modern FFB settings and all supported game-family
          # profiles. All variants of each family inherit the matching profile.
          $iniPath = Join-Path $stage 'FFBPlugin.ini'
          $ini = Get-Content $iniPath -Raw
          if ($ini -notmatch '(?m)^Model2ModernFFB=') {
            $compat = @(
              'Model2ModernFFB=1','Model2ModernFFBConstantGain=100','Model2ModernFFBSpringGain=45',
              'Model2ModernFFBFrictionGain=35','Model2ModernFFBSineGain=30',
              'Model2ModernFFBRumbleGain=20','Model2ModernFFBGamma=100'
            ) -join "`r`n"
            $ini = [regex]::Replace($ini, '(?m)^\[Settings\]\r?\n', "[Settings]`r`n$compat`r`n", 1)
          }
          if ($ini -notmatch '(?m)^\[Model2Modern\]$') {
            $v2 = @(
              '', '[Model2Modern]', 'Enabled=1', 'ConstantGain=100', 'SpringGain=45',
              'FrictionGain=35', 'PeriodicGain=30', 'RumbleGain=20', 'Gamma=100',
              'BuildRate=18', 'ReversalReleaseRate=40', 'SoftClipKnee=75', 'SoftClipLimit=135',
              'InvertConstant=0', 'InvertSpring=0', 'PeriodicMode=0', 'ConditionMode=0',
              'FocusSafety=1', 'CommandLeaseMs=180', 'Telemetry=0', '',
              '[Model2Modern.SegaRally]', 'ConstantGain=100', '',
              '[Model2Modern.Daytona]', 'ConstantGain=100', '',
              '[Model2Modern.Indy500]', 'ConstantGain=100', '',
              '[Model2Modern.STCC]', 'ConstantGain=100', '',
              '[Model2Modern.OverRev]', 'ConstantGain=100', '',
              '[Model2Modern.SuperGT]', 'ConstantGain=100'
            ) -join "`r`n"
            $ini = $ini.TrimEnd() + "`r`n" + $v2 + "`r`n"
          }
          [System.IO.File]::WriteAllText($iniPath, $ini)

      - name: Verify full Model 2 package and game coverage
        shell: pwsh
        run: |
          $stage = 'Package.Model2.GenericDD.Full'
          $required = @(
            'dinput8.dll','SDL2.dll','FFBPlugin.ini','FFBPluginGUI.exe',
            'FFBPluginReadme.txt','MetroFramework.dll'
          )
          foreach ($name in $required) {
            if (!(Test-Path (Join-Path $stage $name))) { throw "Required official Model 2 file missing: $name" }
          }

          if (-not (Select-String -Path (Join-Path $stage 'FFBPlugin.ini') -Pattern '^\s*GameId\s*=\s*25\s*$' -Quiet)) { throw 'Model 2 GameId missing' }
          if (-not (Select-String -Path (Join-Path $stage 'FFBPlugin.ini') -Pattern '^\[Model2Modern\]$' -Quiet)) { throw 'Model2Modern section missing' }

          $profiles = @('SegaRally','Daytona','Indy500','STCC','OverRev','SuperGT')
          foreach ($profile in $profiles) {
            if (-not (Select-String -Path (Join-Path $stage 'FFBPlugin.ini') -SimpleMatch "[Model2Modern.$profile]" -Quiet)) {
              throw "Modern FFB profile missing: $profile"
            }
          }

          # Guard the current upstream Model 2 game coverage. These are the twenty
          # window titles handled by M2Emulator.cpp; all must remain present.
          $source = Get-Content 'Game Files\M2Emulator.cpp' -Raw
          $titles = @(
            'Sega Rally Championship','Sega Rally Championship (Rev B)',"Sega Rally Pro Drivin'",
            'Daytona USA',"Daytona USA '93 Edition",'Daytona USA (Saturn Ads)','Daytona USA Special Edition',
            'Daytona USA Turbo','Daytona USA Turbo (Rev A)','Daytona USA: GTX 2004','Daytona USA: To The Maxx',
            'Indianapolis 500 (Rev A, Deluxe)','Indianapolis 500 (Rev A, Twin, Newer rev)',
            'Indianapolis 500 (Rev A, Twin, Older rev)','Sega Touring Car Championship',
            'Sega Touring Car Championship (Rev A)','Sega Touring Car Championship (Rev B)',
            'Over Rev','Over Rev (Model 2B)','Super GT 24h'
          )
          foreach ($title in $titles) {
            if (-not $source.Contains($title)) { throw "Model 2 supported title missing from source: $title" }
          }

          Write-Host 'Full official-style package contents:'
          Get-ChildItem $stage -Recurse | ForEach-Object {
            $_.FullName.Substring((Resolve-Path $stage).Path.Length + 1)
          } | Sort-Object

      - name: Upload full Model 2 build
        uses: actions/upload-artifact@v4
        with:
          name: Model2-Modern-FFB-Generic-DD-Full-Win32
          path: Package.Model2.GenericDD.Full/
          if-no-files-found: error
          retention-days: 30
