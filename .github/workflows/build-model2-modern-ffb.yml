name: Build Model 2 Modern FFB

on:
  push:
    branches:
      - model2-modern-ffb
      - model2-modern-ffb-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win32-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize generic DD v2 source
        if: github.ref_name == 'model2-modern-ffb-v2'
        shell: pwsh
        run: |
          $sourcePath = 'Common Files\Game.cpp'
          $source = Get-Content $sourcePath -Raw
          $changed = $false

          if ($source -notmatch '(?m)^#define NOMINMAX$') {
            $source = $source.Replace('#include <Windows.h>', "#ifndef NOMINMAX`r`n#define NOMINMAX`r`n#endif`r`n#include <Windows.h>")
            $changed = $true
          }

          $old = @(
            '    case M2CMD_UNCENTERING:',
            '        if (Model2NativePeriodicAvailable())',
            '            Model2OutputNativePeriodic(strength);',
            '        else',
            '            Model2OutputPeriodicFallback(strength);',
            '        Model2OutputRumble(strength, strength);',
            '        break;'
          ) -join "`n"
          $new = @(
            '    case M2CMD_UNCENTERING:',
            '        if (model2Global.periodicMode == 2)',
            '        {',
            '            // Forced generic ConstantForce pulse mode. No vendor detection.',
            '            Model2OutputPeriodicFallback(strength);',
            '        }',
            '        else if (model2Global.periodicMode != 3)',
            '        {',
            '            if (Model2NativePeriodicAvailable())',
            '                Model2OutputNativePeriodic(strength);',
            '            else if (model2Global.periodicMode == 0)',
            '                Model2OutputPeriodicFallback(strength);',
            '            // periodicMode == 1 is Native-only: do not silently fall back.',
            '        }',
            '        Model2OutputRumble(strength, strength);',
            '        break;'
          ) -join "`n"

          $normalized = $source -replace "`r`n", "`n"
          if ($normalized.Contains($old)) {
            $normalized = $normalized.Replace($old, $new)
            $source = $normalized -replace "`n", "`r`n"
            $changed = $true
          }

          if ($changed) {
            [System.IO.File]::WriteAllText((Resolve-Path $sourcePath), $source)
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$sourcePath"
            if (-not (git diff --cached --quiet)) {
              git commit -m '[skip ci] Fix generic DD v2 MSVC and periodic mode semantics'
              git push origin HEAD:model2-modern-ffb-v2
            }
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Restore NuGet packages
        run: nuget restore Dinput8Wrapper.sln -NonInteractive

      - name: Patch upstream missing Cars source entry
        shell: pwsh
        run: |
          $projectPath = 'Dinput8Wrapper.vcxproj'
          $project = Get-Content $projectPath -Raw
          if ($project -notmatch 'Game Files\\Cars\.cpp') {
            $needle = '    <ClCompile Include="Game Files\CrazyTaxi.cpp" />'
            $replacement = $needle + "`r`n" + '    <ClCompile Include="Game Files\Cars.cpp" />'
            if (-not $project.Contains($needle)) { throw 'Could not locate insertion point for Cars.cpp' }
            $project = $project.Replace($needle, $replacement)
            [System.IO.File]::WriteAllText((Resolve-Path $projectPath), $project)
          }

      - name: Build Win32 Release
        run: msbuild Dinput8Wrapper.sln /m /p:Configuration=Release /p:Platform=x86 /verbosity:minimal

      - name: Finalize Model 2 test package
        shell: pwsh
        run: |
          $path = 'Release.Win32\M2Emulator'
          if (!(Test-Path $path)) { throw 'M2Emulator output folder was not generated' }

          $sdl = Get-ChildItem -Path 'packages' -Recurse -Filter 'SDL2.dll' |
            Where-Object { $_.FullName -match '(?i)(x86|win32)' } |
            Select-Object -First 1
          if ($null -eq $sdl) { throw 'Win32 SDL2.dll was not found in restored NuGet packages' }
          Copy-Item $sdl.FullName "$path\SDL2.dll" -Force

          $iniPath = "$path\FFBPlugin.ini"
          $ini = Get-Content $iniPath -Raw

          if ($ini -notmatch '(?m)^Model2ModernFFB=') {
            $compat = @(
              'Model2ModernFFB=1',
              'Model2ModernFFBConstantGain=100',
              'Model2ModernFFBSpringGain=45',
              'Model2ModernFFBFrictionGain=35',
              'Model2ModernFFBSineGain=30',
              'Model2ModernFFBRumbleGain=20',
              'Model2ModernFFBGamma=100'
            ) -join "`r`n"
            $ini = [regex]::Replace($ini, '(?m)^\[Settings\]\r?\n', "[Settings]`r`n$compat`r`n", 1)
          }

          if ($ini -notmatch '(?m)^\[Model2Modern\]$') {
            $v2Lines = @(
              '', '[Model2Modern]', 'Enabled=1', 'ConstantGain=100', 'SpringGain=45',
              'FrictionGain=35', 'PeriodicGain=30', 'RumbleGain=20', 'Gamma=100',
              'BuildRate=18', 'ReversalReleaseRate=40', 'SoftClipKnee=75',
              'SoftClipLimit=135', 'InvertConstant=0', 'InvertSpring=0',
              'PeriodicMode=0', 'ConditionMode=0', 'FocusSafety=1',
              'CommandLeaseMs=180', 'Telemetry=0', '',
              '[Model2Modern.SegaRally]', 'ConstantGain=100', '',
              '[Model2Modern.Daytona]', 'ConstantGain=100', '',
              '[Model2Modern.Indy500]', 'ConstantGain=100', '',
              '[Model2Modern.STCC]', 'ConstantGain=100', '',
              '[Model2Modern.OverRev]', 'ConstantGain=100', '',
              '[Model2Modern.SuperGT]', 'ConstantGain=100'
            )
            $ini = $ini.TrimEnd() + "`r`n" + ($v2Lines -join "`r`n") + "`r`n"
          }

          [System.IO.File]::WriteAllText((Resolve-Path $iniPath), $ini)

      - name: Verify Model 2 package
        shell: pwsh
        run: |
          $path = 'Release.Win32\M2Emulator'
          if (!(Test-Path "$path\dinput8.dll")) { throw 'dinput8.dll was not generated' }
          if (!(Test-Path "$path\SDL2.dll")) { throw 'SDL2.dll was not packaged' }
          if (!(Test-Path "$path\FFBPlugin.ini")) { throw 'M2Emulator FFBPlugin.ini was not generated' }
          if (-not (Select-String -Path "$path\FFBPlugin.ini" -Pattern '^Model2ModernFFB=1$' -Quiet)) { throw 'Modern FFB compatibility flag missing' }
          if (-not (Select-String -Path "$path\FFBPlugin.ini" -Pattern '^\[Model2Modern\]$' -Quiet)) { throw 'Model2Modern v2 section missing' }
          Get-ChildItem $path | Format-Table Name, Length

      - name: Upload Model 2 build
        uses: actions/upload-artifact@v4
        with:
          name: Model2-Modern-FFB-Generic-DD-Win32
          path: Release.Win32/M2Emulator/
          if-no-files-found: error
          retention-days: 30
